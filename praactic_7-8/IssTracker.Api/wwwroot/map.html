<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Траектория МКС</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { margin: 0; font-family: Arial, sans-serif; color: #172033; }
    header { padding: 14px 18px; background: #f3f6fb; }
    h1 { margin: 0 0 6px; font-size: 20px; }
    #message { margin: 0; font-size: 14px; }
    #map { height: calc(100vh - 76px); min-height: 360px; }
  </style>
</head>
<body>
  <header>
    <h1>Траектория Международной космической станции</h1>
    <p id="message">Загружаю сохранённые измерения…</p>
  </header>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([0, 0], 2);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "© OpenStreetMap contributors"
    }).addTo(map);

    // Загружает линию только из нашего API, не из сервиса положения МКС.
    async function loadTrack() {
      const message = document.getElementById("message");

      try {
        const response = await fetch("/api/iss/track.geojson?limit=100");
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.message || "Не удалось загрузить траекторию.");
        }

        const feature = await response.json();
        const line = L.geoJSON(feature, {
          style: { color: "#1464d2", weight: 4 }
        }).addTo(map);

        const points = feature.geometry.coordinates;
        const lastPoint = points[points.length - 1];
        const lastPosition = [lastPoint[1], lastPoint[0]];
        const updatedAt = new Date(feature.properties.lastCapturedAtUtc);

        L.marker(lastPosition)
          .addTo(map)
          .bindPopup("Последнее измерение: " + updatedAt.toLocaleString("ru-RU"));

        map.fitBounds(line.getBounds(), { padding: [24, 24] });
        message.textContent = "Точек на линии: " + points.length
          + ". Последнее измерение: " + updatedAt.toLocaleString("ru-RU");
      } catch (error) {
        message.textContent = error.message;
      }
    }

    loadTrack();
  </script>
</body>
</html>
